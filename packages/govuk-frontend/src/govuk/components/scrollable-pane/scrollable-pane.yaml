params:
  - name: label
    type: string
    required: false
    description: Accessible name for the scrollable pane. Setting `label` or `labelledBy` makes the pane a focusable `region` landmark. If both are set, `label` is used and `labelledBy` is ignored.
  - name: labelledBy
    type: string
    required: false
    description: The `id` of an element that labels the scrollable pane. Ignored if `label` is set.
  - name: html
    type: string
    required: false
    description: HTML to use within the scrollable pane. If a `call` block is provided, the `html` option will be ignored.
  - name: classes
    type: string
    required: false
    description: Classes to add to the scrollable pane container.
  - name: attributes
    type: object
    required: false
    description: HTML attributes (for example data attributes) to add to the scrollable pane container.

