  # Hidden examples are not shown in the review app, but are used for tests and HTML fixtures
  - name: with labelled by
    options:
      labelledBy: pane-heading
      html: |
        <h2 class="govuk-heading-m" id="pane-heading">Historic rainfall in June</h2>
        <p class="govuk-body">Rainfall measurements by station.</p>
  - name: with html
    hidden: true
    options:
      label: Rainfall measurements
      html: '<p>Rainfall measurements <strong>by station</strong>.</p>'
  - name: without content
    hidden: true
    options:
      label: Rainfall measurements
  - name: with label and labelled by
    hidden: true
    options:
      label: Rainfall measurements
      labelledBy: pane-heading
      html: |
        <h2 id="pane-heading">Historic rainfall in June</h2>
  - name: without label
    hidden: true
    options:
      html: |
        <p>Rainfall measurements by station.</p>
  - name: with empty labels
    hidden: true
    options:
      label: ''
      labelledBy: ''
      html: |
        <p>Rainfall measurements by station.</p>
  - name: with classes
    hidden: true
    options:
      label: Rainfall measurements
      classes: app-scrollable-pane--custom-modifier another-pane-class
      html: |
        <p>Rainfall measurements by station.</p>
  - name: with attributes
    hidden: true
    options:
      label: Rainfall measurements
      attributes:
        id: rainfall-pane
        data-custom: custom-value
      html: |
        <p>Rainfall measurements by station.</p>
  - name: with special characters
    hidden: true
    options:
      label: 'Rainfall "measurements" <by station> & year'
      attributes:
        data-custom: 'A "quoted" value <with markup> & symbols'
      html: |
        <p>Rainfall measurements by station.</p>
